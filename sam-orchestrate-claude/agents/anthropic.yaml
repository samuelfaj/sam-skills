interface:
  display_name: "Sam Orchestrate (Claude)"
  short_description: "Run Claude as a cost-aware controller-only orchestrator that delegates execution to subagents across Haiku/Sonnet/Opus/Fable with controlled effort."
  default_prompt: "Use /sam-orchestrate-claude to classify task cost/risk, maintain and update a shared distill Dict before each subagent spawn, delegate all execution to the cheapest safe shape using only haiku, sonnet, opus, or fable, use one haiku low agent for trivial tasks, escalate model tier (haiku->sonnet->opus->fable) before maxing effort, write every subagent prompt in /distill S/C/D/R/O/N/P structure, and run final opus medium review only when risk triggers require it."
